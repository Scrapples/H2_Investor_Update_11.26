  :root { --bg:#F9F7F2; --ink:#1A1A18; --teal:#1E7B6B; --teal-light:#D4EDE8; --red:#C0392B; --border:#DDD8CC; --muted:#7A756A; --card:#FFFFFF;
          --font-title:'FuturaPassata','Futura PT','Century Gothic',sans-serif; --font-body:'GT Walsheim','DM Sans',sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 40px 16px; }
  .gate { background: var(--card); border-radius: 16px; padding: 48px 40px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.10); }
  .gate img { height: 48px; width: auto; display: block; margin: 0 auto 28px; }
  .t { font-family: var(--font-title); font-size: 1.3rem; margin-bottom: 6px; }
  .s { font-size: 0.82rem; color: var(--muted); margin-bottom: 28px; }
  input { width: 100%; padding: 12px 16px; border: 1.5px solid var(--border); border-radius: 8px; font-family: var(--font-body); font-size: 0.95rem; color: var(--ink); background: var(--bg); outline: none; margin-bottom: 12px; }
  input:focus { border-color: var(--teal); }
  .small { font-size: 0.85rem; padding: 10px 14px; margin-bottom: 8px; }
  .err { font-size: 0.78rem; color: var(--red); margin-bottom: 10px; min-height: 18px; }
  button { width: 100%; padding: 13px; border: none; border-radius: 8px; background: var(--teal); color: #fff; font-family: var(--font-body); font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  button:hover { background: #165f52; }
  button:disabled { opacity: 0.6; cursor: wait; }

  // EmailJS (public keys, by design) - same account as the H1 report
  const EMAILJS_SERVICE_ID  = 'service_jmi5236';
  const EMAILJS_TEMPLATE_ID = 'template_teywkhh';
  const EMAILJS_PUBLIC_KEY  = 'Hgii8PqVNdcAjK61c';
  const NOTIFY_TO = 'ben@sparesnacks.com';
  try { emailjs.init(EMAILJS_PUBLIC_KEY); } catch (e) { console.warn('EmailJS unavailable'); }

  const londonTime = () => { const pad = n => String(n).padStart(2,'0'); const t = new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/London'})); return pad(t.getDate())+' '+t.toLocaleString('en-GB',{month:'short'})+' '+t.getFullYear()+', '+pad(t.getHours())+':'+pad(t.getMinutes()); };

  function sendLoginAlert() {
    try {
      return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_email: NOTIFY_TO, reply_to: NOTIFY_TO,
        request_name: ' -  Login alert (H2 FY26 report)', request_email: ' - ',
        login_time: londonTime(), user_agent: navigator.userAgent.substring(0, 120)
      }).catch(() => {});
    } catch (e) { return Promise.resolve(); }
  }

  function sendAccessRequest() {
    const name = document.getElementById('requestName').value.trim();
    const email = document.getElementById('requestEmail').value.trim();
    const err = document.getElementById('requestError');
    if (!name) { err.textContent = 'Please enter your name.'; return; }
    if (!email || !email.includes('@')) { err.textContent = 'Please enter a valid email.'; return; }
    err.textContent = '';
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: NOTIFY_TO, reply_to: email, request_name: name, request_email: email,
      login_time: londonTime(), user_agent: 'Access Request (H2 FY26 report)'
    }).then(() => {
      document.getElementById('accessRequestForm').style.display = 'none';
      document.getElementById('accessRequestSent').style.display = 'block';
    }).catch(() => { err.textContent = 'Failed to send - please email ' + NOTIFY_TO + ' directly.'; });
  }

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

  async function unlock() {
    const pw = document.getElementById('pwInput').value;
    const btn = document.getElementById('pwBtn');
    const errEl = document.getElementById('pwError');
    if (!pw) return;
    btn.disabled = true; btn.textContent = 'Unlocking…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
                                                base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
      const html = new TextDecoder().decode(plain);
      await Promise.race([sendLoginAlert(), new Promise(r => setTimeout(r, 1500))]);
      document.open(); document.write(html); document.close();
    } catch (e) {
      errEl.textContent = 'Incorrect password - please try again.';
      document.getElementById('pwInput').style.borderColor = 'var(--red)';
      setTimeout(() => { const i = document.getElementById('pwInput'); if (i) { errEl.textContent = ''; i.style.borderColor = 'var(--border)'; } }, 2500);
      btn.disabled = false; btn.textContent = 'Access Dashboard';
    }
  }

  document.getElementById('pwBtn').addEventListener('click', unlock);
  document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
  document.getElementById('reqBtn').addEventListener('click', sendAccessRequest);
</script>
